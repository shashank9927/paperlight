name: Verify Havisu PDF
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  processing:
    # Keep browser native dependencies reproducible when ubuntu-latest changes.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PAPERLIGHT_STRICT_BROWSERS: '1'
      PAPERLIGHT_PREBUILT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Use the official Ubuntu HTTPS package archive
        run: |
          for taskAptSource in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$taskAptSource" ]; then
              sudo sed -i -E 's#https?://azure[.]archive[.]ubuntu[.]com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "$taskAptSource"
            fi
          done
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install -r scripts/requirements-test.txt
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: node scripts/release-manifest.mjs
      - uses: actions/cache/restore@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-1.64.1
          restore-keys: playwright-${{ runner.os }}-1.64.1
      - name: Migrate platform-specific WebKit from the legacy browser cache
        if: steps.browsers.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install --force webkit
      - name: Prepare cached browsers and their system libraries
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Save prepared browsers independently of test results
        if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-1.64.1
      - name: Verify WebKit light-theme contrast
        run: npx playwright test tests/e2e/states.spec.ts --project=webkit --grep "light at" --repeat-each=2 --workers=1 --output=.cache/theme-gate
      - name: Verify crawlability, offline navigation and analytics
        run: npx playwright test tests/e2e/seo.spec.ts tests/e2e/analytics.spec.ts --output=.cache/seo-gate
      - run: npm run test:e2e -- --grep-invert "measured cold/warm"
      - name: Repeat cancellation, stale-result and engine-retry regressions
        run: npx playwright test tests/e2e/release-workflows.spec.ts tests/e2e/hardening.spec.ts tests/e2e/unlock-compatibility.spec.ts tests/e2e/experience.spec.ts --grep "invalid admission cancellation|rapid reset|unavailable PDF engine|cancellation and reset|batch cancellation" --repeat-each=3 --workers=2 --output=.cache/lifecycle-gate
      - run: npm run test:e2e -- tests/e2e/benchmark.spec.ts --workers=1 --output=.cache/benchmarks
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: .cache/benchmark-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            test-results/
            playwright-report/
            .cache/independent/
            .cache/benchmarks/
            .cache/benchmark-report/
            .cache/theme-gate/
            .cache/seo-gate/
            .cache/lifecycle-gate/
            .cache/release-manifest.json
          retention-days: 14
  static-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: docker build -t paperlight-static .
      - run: docker run -d --name paperlight-static -p 127.0.0.1:4180:8080 paperlight-static
      - name: Wait for static host
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:4180/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs paperlight-static
          echo "Static host did not become ready" >&2
          exit 1
      - run: node scripts/check-hosting.mjs
      - run: node scripts/load-static.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-host-load
          path: .cache/static-load-report.json
          retention-days: 14
