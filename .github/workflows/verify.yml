name: Verify Paperlight
on: [push, pull_request]
permissions:
  contents: read
jobs:
  processing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAPERLIGHT_STRICT_BROWSERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install -r scripts/requirements-test.txt
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.64.1
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e -- --grep-invert "measured cold/warm"
      - run: npm run test:e2e -- tests/e2e/benchmark.spec.ts --workers=1 --output=.cache/benchmarks
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: .cache/benchmark-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            test-results/
            playwright-report/
            .cache/independent/
            .cache/benchmarks/
            .cache/benchmark-report/
          retention-days: 14
  static-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: docker build -t paperlight-static .
      - run: docker run -d --name paperlight-static -p 127.0.0.1:4180:8080 paperlight-static
      - run: node scripts/check-hosting.mjs
