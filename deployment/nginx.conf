map $uri $paperlight_cache {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    "~^/pdf-assets/[a-f0-9]{12}/" "public, max-age=31536000, immutable";
}
map $request_method $paperlight_allow {
    default "GET, HEAD";
    GET "";
    HEAD "";
}
map "$host:$uri" $havisu_page_redirect {
    default 0;
    "~^paperlight-kappa[.]vercel[.]app:(/|/tools/(merge|split|compress|organize|rotate|images-to-pdf|pdf-to-images|watermark|page-numbers|protect|unlock|sign)(/index[.]html|[.]html|/)?|/alternatives/ilovepdf(/index[.]html|[.]html|/)?)$" 1;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Preserve the browser's public scheme/host/port behind reverse proxies.
    absolute_redirect off;
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;
    reset_timedout_connection on;
    max_ranges 1;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    if ($havisu_page_redirect = 1) { return 308 https://pdf.havisu.com$request_uri; }
    add_header Allow $paperlight_allow always;
    add_header Cache-Control $paperlight_cache always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; font-src 'self' blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options DENY always;
    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/javascript text/css application/json application/wasm image/svg+xml;
    location = /index.html { return 308 /$is_args$args; }
    location ~ ^(/tools/(merge|split|compress|organize|rotate|images-to-pdf|pdf-to-images|watermark|page-numbers|protect|unlock|sign))(?:/index[.]html|[.]html|/)$ { return 308 $1$is_args$args; }
    location ~ ^/alternatives/ilovepdf(?:/|/index[.]html|[.]html)$ { return 308 /alternatives/ilovepdf$is_args$args; }
    location = /alternatives/ilovepdf { try_files /alternatives/ilovepdf.html =404; }
    location = / { try_files /index.html =404; }
    location = /manifest.webmanifest { types { application/manifest+json webmanifest; } try_files $uri =404; }
    location ~ ^/tools/(merge|split|compress|organize|rotate|images-to-pdf|pdf-to-images|watermark|page-numbers|protect|unlock|sign)/?$ {
        try_files $uri.html =404;
    }
    location ~ \.wasm$ { types { application/wasm wasm; } try_files $uri =404; }
    location ~ \.(js|mjs)$ { types { application/javascript js mjs; } try_files $uri =404; }
    location ~ /$ { return 404; }
    location / { try_files $uri =404; }
    error_page 404 /404.html;
    # Revalidate the shell and service worker; content hashes identify JS/CSS.

}
